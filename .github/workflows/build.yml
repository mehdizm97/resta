name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare Environment & Gradle Properties
        run: |
          mkdir -p android/gradle
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseG1GC" > android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Install Dependencies & Build
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npm install
          npm install @capacitor/android@latest
          
          # ساخت پوشه www و انتقال فایل‌های وب
          mkdir -p www
          cp -r *.html *.js *.css www/ 2>/dev/null || true
          
          npx cap add android
          npx cap sync android
          
          cd android
          chmod +x gradlew
          # استفاده از دستور آفلاین یا پاکسازی مقطعی برای جلوگیری از خطای jar
          ./gradlew clean assembleDebug --offline || ./gradlew assembleDebug --refresh-dependencies

      - name: Upload APK Artifact
        uses: upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
