name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configure Gradle Cache & Environment
        run: |
          # تنظیم متغیرهای محیطی برای جلوگیری از خطاهای حافظه و فایل‌سیستم در گریدل
          mkdir -p ~/.gradle
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties

      - name: Install Dependencies & Build
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npm install
          npm install @capacitor/android@latest
          
          # ساخت خودکار پوشه www و انتقال فایل‌های وب از ریشه
          mkdir -p www
          cp -r *.html *.js *.css www/ 2>/dev/null || true
          
          # اضافه کردن پلتفرم اندروید و سینک کردن
          npx cap add android
          npx cap sync android
          
          # تنظیم دسترسی اجرای گريدل و شروع فرآیند کامپایل بدون کش‌های مخرب
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --refresh-dependencies

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
